name: Sync new issues and PRs to project board

# Adds newly created issues and PRs from an allowlist of repos to
# https://github.com/orgs/asago-ai/projects/1.
#
# Exclusions:
#   - repos not in the allowlist below
#   - PRs authored by dependabot[bot]
#
# Requires the repo secret PROJECT_SYNC_TOKEN: a PAT with repo + project
# (classic) or "Projects: write" org permission (fine-grained).
#
# The mutation addProjectV2ItemById is idempotent: items already present
# on the board are not duplicated, so re-runs are safe.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  # Read the workflow's own run history to determine the cutoff time.
  actions: read

env:
  ORG: asago-ai
  PROJECT_NUMBER: "1"
  GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Only these repos are added to the board automatically.
      ALLOWED_REPOS: >-
        architecture-decision-records
        asago-artifact-generator
        asago-examples
        asago-policy-mapper
        asago-scenario-generator
    steps:
      - name: Sync new items to the project board
        env:
          # Built-in token for reading run history.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO_API="repos/$ORG/.github"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # --- Resolve the project node ID -------------------------------
          PROJECT_ID=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) { id }
              }
            }' -F org="$ORG" -F number="$PROJECT_NUMBER" \
            --jq '.data.organization.projectV2.id')
          echo "Project ID: $PROJECT_ID"

          # --- Determine the cutoff from the previous successful run ------
          # Uses the workflow's own run history instead of a repo variable,
          # so the PAT needs no Actions-variable permission. The built-in
          # GITHUB_TOKEN provides actions:read (see permissions above).
          CUTOFF=$(GH_TOKEN="$GITHUB_TOKEN" gh api \
            "$REPO_API/actions/workflows/project-sync.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].run_started_at' 2>/dev/null || true)

          if [ -z "$CUTOFF" ] || [ "$CUTOFF" = "null" ]; then
            echo "No previous successful run. Only items created from now on"
            echo "will be tracked; nothing is added on this run."
            exit 0
          fi
          echo "Cutoff: $CUTOFF"

          # --- Collect new issues and PRs --------------------------------
          search_items() {
            # $1: "is:issue" or "is:pr"
            # Writes one JSON object per line to stdout. Returns non-zero
            # on API failure so the caller can abort.
            local cursor="" result
            while :; do
              local after=""
              if [ -n "$cursor" ]; then after="-f after=$cursor"; fi
              if ! result=$(gh api graphql \
                -f query='
                query($q: String!, $after: String) {
                  search(query: $q, type: ISSUE, first: 100, after: $after) {
                    nodes {
                      ... on Issue {
                        __typename id number title
                        repository { name }
                      }
                      ... on PullRequest {
                        __typename id number title
                        author { login }
                        repository { name }
                      }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }' \
                -f q="org:$ORG $1 created:>$CUTOFF" \
                $after); then
                echo "Search failed for $1" >&2
                return 1
              fi
              echo "$result" | jq -c '.data.search.nodes[]'
              cursor=$(echo "$result" | jq -r '.data.search.pageInfo.endCursor')
              if [ "$(echo "$result" | jq '.data.search.pageInfo.hasNextPage')" != "true" ]; then
                break
              fi
            done
          }

          added=0
          skipped=0

          all_items=$( { search_items "is:issue"; search_items "is:pr"; } ) || exit 1

          for item in $all_items; do
            type=$(echo "$item" | jq -r '.__typename')
            repo=$(echo "$item" | jq -r '.repository.name')
            number=$(echo "$item" | jq -r '.number')
            node_id=$(echo "$item" | jq -r '.id')
            author=$(echo "$item" | jq -r '.author.login // "unknown"')

            # Only process repos in the allowlist.
            if ! grep -qw "$repo" <<< "$ALLOWED_REPOS"; then
              skipped=$((skipped + 1))
              echo "Skipping $repo#$number (repo not in allowlist)"
              continue
            fi

            # Skip Dependabot PRs. The search API reports the login as
            # "dependabot"; the REST/GraphQL APIs report "dependabot[bot]".
            if [ "$type" = "PullRequest" ] \
              && { [ "$author" = "dependabot" ] || [ "$author" = "dependabot[bot]" ]; }; then
              skipped=$((skipped + 1))
              echo "Skipping Dependabot PR $repo#$number"
              continue
            fi

            gh api graphql \
              -f query='
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {
                  projectId: $projectId
                  contentId: $contentId
                }) {
                  item { id }
                }
              }' \
              -f projectId="$PROJECT_ID" -f contentId="$node_id" > /dev/null
            echo "Added $type $repo#$number (by $author)"
            added=$((added + 1))
          done

          echo "Added: $added, skipped: $skipped"

          echo "Done. The next run will pick up items created after $NOW."
